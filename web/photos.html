    <div class="group">
        <svg class="icon" aria-hidden="true" viewBox="0 0 24 24"><g><path d="M21.53 20.47l-3.66-3.66C19.195 15.24 20 13.214 20 11c0-4.97-4.03-9-9-9s-9 4.03-9 9 4.03 9 9 9c2.215 0 4.24-.804 5.808-2.13l3.66 3.66c.147.146.34.22.53.22s.385-.073.53-.22c.295-.293.295-.767.002-1.06zM3.5 11c0-4.135 3.365-7.5 7.5-7.5s7.5 3.365 7.5 7.5-3.365 7.5-7.5 7.5-7.5-3.365-7.5-7.5z"></path></g></svg>

    <button class="theme-switcher" id="themeToggle">🌙 夜间模式</button>

    <main class="photo-page">
        <section class="photo-hero">
            <h1>相册/摄影</h1>
        </section>

        <section class="album-shell" aria-label="翻页相册">
            <button class="album-nav album-prev" type="button" aria-label="上一张">‹</button>
            <div class="album-book" id="albumBook">
                <div class="album-loading">正在整理相册</div>
            </div>
            <button class="album-nav album-next" type="button" aria-label="下一张">›</button>
            <div class="album-status"><span id="albumTitle">相册</span><small id="albumCount">0 / 0</small></div>
        </section>
    </main>
    <script>
      (function () {
        const albumBook = document.getElementById('albumBook');
        const prev = document.querySelector('.album-prev');
        const next = document.querySelector('.album-next');
        const title = document.getElementById('albumTitle');
        const count = document.getElementById('albumCount');
        const imageExtensions = /\.(avif|gif|jpe?g|png|webp)$/i;
        const githubPhotosApi = 'https://api.github.com/repos/HalleyLab/Myself/contents/web/photos?ref=master';
        const fallbackPhotos = [
          'photos/JHU（hw校区建筑）.png',
          'photos/JHU（hw校区）.png',
          'photos/三杯鸡.jpg',
          'photos/九江甘棠湖.png',
          'photos/九江甘棠湖（夜鹭）.png',
          'photos/九江（日出）.png',
          'photos/人大图书馆.png',
          'photos/人大明德楼.png',
          'photos/人大烤冷面.jpg',
          'photos/人大猫猫庙.png',
          'photos/冰淇淋三文鱼寿司.JPG',
          'photos/北京紫竹院公园（小黄鸭）.png',
          'photos/北京紫竹院公园（月季）.png',
          'photos/北京紫竹院公园（盆栽）.png',
          'photos/北京紫竹院公园（苍鹭）.png',
          'photos/北京紫竹院公园（蝟实）.png',
          'photos/北京紫竹院公园（麻雀）.png',
          'photos/华盛顿博物馆（希望之星）.png',
          'photos/华盛顿博物馆（莱特兄弟）.png',
          'photos/华盛顿白宫.png',
          'photos/和朋友们吃德吉酸奶.JPG',
          'photos/德克萨斯（三丽鸥）.JPG',
          'photos/德克萨斯（企鹅物流）.jpg',
          'photos/德克萨斯（生无可恋）.JPG',
          'photos/德克萨斯（电瓶）.jpg',
          'photos/月球.PNG',
          'photos/桃金娘（投降）.jpg',
          'photos/浙大启真湖.jpg',
          'photos/浙大玉湖宿舍.png',
          'photos/浙大药学院.png',
          'photos/浙大蟹老板.png',
          'photos/滑蛋.jpg',
          'photos/脑片.png',
          'photos/首尔南山夜景.PNG'
        ].map(url => ({ url, title: titleFromPath(url) }));

        let pages = [];
        let index = 0;
        let locked = false;

        function titleFromPath(path) {
          const fileName = decodeURIComponent(path.split('/').pop() || '照片');
          return fileName.replace(/\.[^.]+$/, '');
        }

        function createPage(photo, photoIndex) {
          const page = document.createElement('article');
          page.className = 'album-page' + (photoIndex === 0 ? ' is-active' : '');
          page.dataset.title = photo.title;
          page.innerHTML =
            '<a href="' + photo.url + '" target="_blank" rel="noopener noreferrer">' +
              '<img src="' + photo.url + '" alt="' + photo.title + '" loading="' + (photoIndex === 0 ? 'eager' : 'lazy') + '">' +
            '</a>' +
            '<span>' + photo.title + '</span>';
          return page;
        }

        function setPhotos(photos) {
          albumBook.textContent = '';
          pages = photos.map(createPage);
          pages.forEach(page => albumBook.appendChild(page));
          index = 0;
          title.textContent = photos[0] ? photos[0].title : '相册';
          count.textContent = photos.length ? '1 / ' + photos.length : '0 / 0';
          prev.disabled = true;
          next.disabled = photos.length <= 1;
        }

        function normalizeGithubPhotos(items) {
          return items
            .filter(item => item.type === 'file' && item.size > 0 && imageExtensions.test(item.name))
            .sort((a, b) => a.name.localeCompare(b.name, 'zh-Hans-CN'))
            .map(item => ({
              url: item.download_url || item.path.replace(/^web\//, ''),
              title: titleFromPath(item.name)
            }));
        }

        function loadPhotos() {
          fetch(githubPhotosApi, { cache: 'no-store' })
            .then(response => response.ok ? response.json() : Promise.reject(new Error('GitHub photos unavailable')))
            .then(items => {
              const photos = normalizeGithubPhotos(items);
              setPhotos(photos.length ? photos : fallbackPhotos);
            })
            .catch(function () {
              setPhotos(fallbackPhotos);
            });
        }

        function render(nextIndex, direction) {
          if (locked || nextIndex === index || nextIndex < 0 || nextIndex >= pages.length) return;
          locked = true;
          const current = pages[index];
          const incoming = pages[nextIndex];
          pages.forEach(page => page.classList.remove('is-entering', 'is-leaving-next', 'is-leaving-prev'));
          incoming.classList.add('is-active', 'is-entering');
          current.classList.add(direction > 0 ? 'is-leaving-next' : 'is-leaving-prev');
          window.setTimeout(function () {
            current.classList.remove('is-active', 'is-leaving-next', 'is-leaving-prev');
            incoming.classList.remove('is-entering');
            index = nextIndex;
            title.textContent = incoming.dataset.title;
            count.textContent = (index + 1) + ' / ' + pages.length;
            prev.disabled = index === 0;
            next.disabled = index === pages.length - 1;
            locked = false;
          }, 620);
        }

        prev.addEventListener('click', function () { render(index - 1, -1); });
        next.addEventListener('click', function () { render(index + 1, 1); });
        document.addEventListener('keydown', function (event) {
          if (event.key === 'ArrowLeft') render(index - 1, -1);
          if (event.key === 'ArrowRight') render(index + 1, 1);
        });
        prev.disabled = true;
        next.disabled = true;
        loadPhotos();
      }());
    </script>
</body>
